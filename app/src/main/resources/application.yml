
spring:
  application:
    name: EvShop
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:openai}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eshop}
    username: ${DB_USER:eshop}
    password: ${DB_PASSWORD:eshop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:3600}

langchain4j:
  chat-memory:
    max-tokens: 2000
