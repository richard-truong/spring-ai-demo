
spring:
  application:
    name: EvShop
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:openai}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eshop}
    username: ${DB_USER:eshop}
    password: ${DB_PASSWORD:eshop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  ai:
    mcp:
      server:
        protocol: STREAMABLE

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:3600}
  rag:
    collection: eshop-policies
    max-results: 4
    min-score: 0.5
    keyword-weight: 0.3
    qdrant:
      host: ${QDRANT_HOST:localhost}
      port: ${QDRANT_PORT:6334}
      api-key: ${QDRANT_API_KEY:}
  mcp:
    server-url: ${MCP_SERVER_URL:http://localhost:8080/mcp}

langchain4j:
  chat-memory:
    max-tokens: 2000
