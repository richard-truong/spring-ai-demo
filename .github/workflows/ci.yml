name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: ./gradlew build

  sonar:
    runs-on: ubuntu-latest
    needs: build
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Runs only when SONAR_TOKEN is set; otherwise skipped.
      # Note: requires the org.sonarqube Gradle plugin in build.gradle.
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar

      - name: Skip Sonar scan (no SONAR_TOKEN)
        if: env.SONAR_TOKEN == ''
        run: echo "Sonar scan skipped: SONAR_TOKEN is not set"

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build app image (smoke test, no push)
        run: JWT_SECRET="012345678901234567890123456789012" docker compose -f docker/docker-compose.yml build app
